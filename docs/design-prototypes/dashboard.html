<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>코스트스캐너 — 대시보드</title>
<link rel="stylesheet" href="shared/tokens.css" />
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="shared/common.jsx"></script>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;

// ── Hero metric: "원가 체감 온도" ─────────────────────────
function CostThermometer() {
  const score = 73; // today's cost health 0-100
  const yd = 68;
  const delta = score - yd;
  return (
    <div className="card" style={{ padding: 28, background: 'linear-gradient(180deg, #FFF8ED 0%, #FFFFFF 65%)' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'start', marginBottom: 18 }}>
        <div>
          <div className="t-caps" style={{ color: 'var(--brand-600)' }}>오늘의 원가 온도</div>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 10, marginTop: 8 }}>
            <CountUp to={score} className="t-num-xl" style={{ color: 'var(--ink-900)' }} />
            <span className="t-h3" style={{ color: 'var(--ink-500)', fontWeight: 600 }}>/ 100</span>
            <span className="chip chip-down" style={{ marginLeft: 6 }}>
              <Icon name="down" size={12} strokeWidth={2.4} /> 어제 대비 +{delta}
            </span>
          </div>
          <div className="t-sm" style={{ marginTop: 10, maxWidth: 340 }}>
            월 예산 대비 <b style={{ color: 'var(--down-500)' }}>양호</b>한 흐름이에요. 배추·마늘 가격 급등만 주시하세요.
          </div>
        </div>
        <button className="btn btn-outline btn-sm">
          <Icon name="info" size={14} /> 산출 방식
        </button>
      </div>
      {/* Thermometer bar */}
      <div style={{ position: 'relative', marginTop: 20 }}>
        <div style={{ height: 12, borderRadius: 999, background: 'linear-gradient(90deg, var(--up-500) 0%, var(--warn-500) 45%, var(--down-500) 100%)' }} />
        <div style={{ position: 'absolute', left: score + '%', top: -4, transform: 'translateX(-50%)' }}>
          <div style={{ width: 20, height: 20, borderRadius: 999, background: '#fff', border: '3px solid var(--ink-900)', boxShadow: 'var(--sh-2)' }} />
        </div>
        <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 10 }}>
          <span className="t-xs">위험 0</span>
          <span className="t-xs">주의 50</span>
          <span className="t-xs">안정 100</span>
        </div>
      </div>
    </div>
  );
}

// ── Stat card ─────────────────────────────────────────────
function StatCard({ label, value, delta, spark, color, iconName, suffix }) {
  const up = delta > 0;
  return (
    <div className="card" style={{ padding: 22, position: 'relative', overflow: 'hidden' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <div className="t-caps">{label}</div>
        <div style={{ width: 32, height: 32, borderRadius: 10, background: color + '22', color: color, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <Icon name={iconName} size={16} />
        </div>
      </div>
      <div className="t-num-lg" style={{ marginTop: 14, color: 'var(--ink-900)' }}>
        {value}{suffix && <span style={{ fontSize: 16, color: 'var(--ink-500)', fontWeight: 600, marginLeft: 3 }}>{suffix}</span>}
      </div>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 8 }}>
        <span className={cn('chip', up ? 'chip-up' : 'chip-down')}>
          <Icon name={up ? 'up' : 'down'} size={11} strokeWidth={2.4} /> {fmtPct(delta)}
        </span>
        <Sparkline data={spark} color={color} width={84} height={28} />
      </div>
    </div>
  );
}

// ── Price Radar clock (novel) ─────────────────────────────
function PriceRadarPanel() {
  const hourly = [4,3,3,5,7,12,18,22,20,17,14,12,10,9,8,9,11,14,16,13,10,7,5,4];
  return (
    <div className="card" style={{ padding: 24 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'start' }}>
        <div>
          <div className="t-h3">가격 레이더 <span style={{ fontSize: 12, color: 'var(--ink-500)', fontWeight: 500, marginLeft: 6 }}>24시간</span></div>
          <div className="t-sm" style={{ marginTop: 4 }}>시간대별 가격 변동 빈도</div>
        </div>
        <div style={{ display: 'flex', gap: 6 }}>
          <span className="chip chip-neut">전체 <b style={{ color: 'var(--ink-900)' }}>236</b>건</span>
        </div>
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 24, marginTop: 16 }}>
        <PriceClock hours={24} data={hourly} size={220} />
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 12 }}>
          <div style={{ padding: 14, background: 'var(--ink-50)', borderRadius: 12 }}>
            <div className="t-xs">피크 시간대</div>
            <div style={{ fontWeight: 700, fontSize: 20, marginTop: 4, color: 'var(--ink-900)' }}>오전 6–8시</div>
            <div className="t-sm" style={{ marginTop: 2 }}>새벽 경매 직후 가격 반영</div>
          </div>
          <div style={{ padding: 14, background: 'var(--ink-50)', borderRadius: 12 }}>
            <div className="t-xs">가장 안정</div>
            <div style={{ fontWeight: 700, fontSize: 20, marginTop: 4, color: 'var(--ink-900)' }}>밤 11–4시</div>
            <div className="t-sm" style={{ marginTop: 2 }}>이 시간 구매 예약을 추천해요</div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Savings odometer ─────────────────────────────────────
function SavingsOdometer() {
  return (
    <div className="card" style={{ padding: 24, background: 'linear-gradient(140deg, var(--ink-900), #2A1E0E 70%)', color: '#fff' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'start' }}>
        <div>
          <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: '0.08em', color: 'var(--brand-300)', textTransform: 'uppercase' }}>이달 누적 절약</div>
          <div style={{ marginTop: 10 }}>
            <CountUp to={842000} prefix="₩" style={{ fontSize: 44, fontWeight: 800, letterSpacing: '-0.03em' }} />
          </div>
          <div style={{ fontSize: 13, color: 'rgba(255,255,255,0.7)', marginTop: 6 }}>
            작년 4월 대비 <span style={{ color: 'var(--brand-300)', fontWeight: 700 }}>+38.2%</span> · 국밥 <b>281그릇</b> 분량
          </div>
        </div>
        <div style={{ background: 'rgba(255,255,255,0.08)', padding: '6px 10px', borderRadius: 999, fontSize: 11, fontWeight: 600 }}>
          <span className="pulse-dot" style={{ display: 'inline-block', width: 6, height: 6, borderRadius: 999, background: 'var(--brand-400)', marginRight: 6 }} />LIVE
        </div>
      </div>
      {/* progress to goal */}
      <div style={{ marginTop: 20 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12, marginBottom: 6 }}>
          <span style={{ color: 'rgba(255,255,255,0.7)' }}>이달 절약 목표 ₩1,200,000</span>
          <span style={{ fontWeight: 700, color: 'var(--brand-300)' }}>70%</span>
        </div>
        <div style={{ height: 8, borderRadius: 999, background: 'rgba(255,255,255,0.1)', overflow: 'hidden' }}>
          <div style={{ width: '70%', height: '100%', background: 'linear-gradient(90deg, var(--brand-400), var(--brand-300))', borderRadius: 999 }} />
        </div>
      </div>
    </div>
  );
}

// ── Price changes feed ────────────────────────────────────
function PriceFeed() {
  const rows = ingredientSeed.slice(0, 6);
  return (
    <div className="card" style={{ padding: 0, overflow: 'hidden' }}>
      <div style={{ padding: '20px 24px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderBottom: '1px solid var(--ink-100)' }}>
        <div>
          <div className="t-h3">실시간 가격 변동</div>
          <div className="t-sm" style={{ marginTop: 2 }}>내 재료 10개 · 30분 전 업데이트</div>
        </div>
        <button className="btn btn-ghost btn-sm">전체 보기 <Icon name="arrow" size={14} /></button>
      </div>
      <table className="tbl">
        <thead>
          <tr>
            <th>품목</th>
            <th style={{ textAlign: 'right' }}>현재가</th>
            <th style={{ textAlign: 'right' }}>변동</th>
            <th style={{ textAlign: 'center' }}>7일 추이</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          {rows.map((r, i) => (
            <tr key={i}>
              <td>
                <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                  <div style={{ width: 32, height: 32, borderRadius: 8, background: 'var(--ink-50)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14 }}>
                    {{'채소':'🥬','육류':'🥩','유제품':'🥚','생선':'🐟','조미료':'🧂'}[r.cat] || '🍴'}
                  </div>
                  <div>
                    <div style={{ fontWeight: 600, color: 'var(--ink-900)' }}>{r.name}</div>
                    <div className="t-xs">{r.cat} · {r.unit}</div>
                  </div>
                </div>
              </td>
              <td style={{ textAlign: 'right', fontWeight: 700 }} className="tnum">{fmtKRW(r.price)}</td>
              <td style={{ textAlign: 'right' }}>
                <span className={cn('chip', r.change > 0 ? 'chip-up' : r.change < 0 ? 'chip-down' : 'chip-neut')}>
                  {r.change > 0 && <Icon name="up" size={10} strokeWidth={2.6}/>}
                  {r.change < 0 && <Icon name="down" size={10} strokeWidth={2.6}/>}
                  {fmtPct(r.change)}
                </span>
              </td>
              <td>
                <div style={{ display: 'flex', justifyContent: 'center' }}>
                  <Sparkline data={r.spark} color={r.change >= 0 ? 'var(--up-500)' : 'var(--down-500)'} width={100} height={28} />
                </div>
              </td>
              <td style={{ textAlign: 'right' }}>
                <button className="btn btn-ghost btn-sm" style={{ padding: '6px 10px' }}><Icon name="eye" size={14} /></button>
              </td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

// ── Monthly cost chart ────────────────────────────────────
function MonthlyCostChart() {
  const [range, setRange] = useState('90d');
  const labels = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const thisYr = [2.1,2.3,2.6,2.4,2.5,2.8,3.0,2.9,2.6,2.7,2.5,2.8];
  const lastYr = [1.9,2.0,2.2,2.3,2.4,2.6,2.9,2.8,2.5,2.6,2.7,2.9];
  return (
    <div className="card" style={{ padding: 24 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'start', marginBottom: 16 }}>
        <div>
          <div className="t-h3">월별 식자재 지출 추이</div>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 12, marginTop: 6 }}>
            <CountUp to={2800000} prefix="₩" className="t-num-md" />
            <span className="chip chip-up"><Icon name="up" size={11} strokeWidth={2.6}/> +7.2%</span>
            <span className="t-sm">전월 대비</span>
          </div>
        </div>
        <div style={{ display: 'flex', gap: 4, background: 'var(--ink-50)', padding: 4, borderRadius: 10 }}>
          {['30d','90d','1y'].map(r => (
            <button key={r} onClick={() => setRange(r)}
              style={{ padding: '6px 12px', fontSize: 12, fontWeight: 600, borderRadius: 8,
                background: range === r ? '#fff' : 'transparent',
                color: range === r ? 'var(--ink-900)' : 'var(--ink-500)',
                boxShadow: range === r ? 'var(--sh-1)' : 'none' }}>
              {{'30d':'30일','90d':'3개월','1y':'1년'}[r]}
            </button>
          ))}
        </div>
      </div>
      <AreaChart
        series={[
          { name: '올해', data: thisYr.map(v => v * 1e6) },
          { name: '작년', data: lastYr.map(v => v * 1e6) },
        ]}
        labels={labels}
        colors={['var(--brand-500)', 'var(--ink-400)']}
        highlightIdx={3}
      />
      <div style={{ display: 'flex', gap: 18, marginTop: 14, justifyContent: 'center' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 13 }}>
          <div style={{ width: 10, height: 10, borderRadius: 2, background: 'var(--brand-500)' }} />
          <span style={{ color: 'var(--ink-700)' }}>2026</span>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 13 }}>
          <div style={{ width: 10, height: 10, borderRadius: 2, background: 'var(--ink-400)' }} />
          <span style={{ color: 'var(--ink-700)' }}>2025</span>
        </div>
      </div>
    </div>
  );
}

// ── Category breakdown donut ──────────────────────────────
function CategoryBreakdown() {
  const data = [
    { label: '육류', value: 42, color: 'var(--c6)' },
    { label: '채소', value: 28, color: 'var(--c3)' },
    { label: '생선', value: 14, color: 'var(--c4)' },
    { label: '유제품', value: 9, color: 'var(--c2)' },
    { label: '조미료', value: 4, color: 'var(--c5)' },
    { label: '기타', value: 3, color: 'var(--ink-300)' },
  ];
  return (
    <div className="card" style={{ padding: 24 }}>
      <div className="t-h3">카테고리별 비중</div>
      <div className="t-sm" style={{ marginTop: 2, marginBottom: 16 }}>4월 누적 지출 ₩2.8M</div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 24 }}>
        <Donut data={data} size={180} thickness={24}
          center={<>
            <div style={{ fontSize: 11, color: 'var(--ink-500)', fontWeight: 600 }}>육류</div>
            <div className="t-num-md">42<span style={{ fontSize: 14 }}>%</span></div>
          </>}
        />
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 10 }}>
          {data.map((d, i) => (
            <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
              <div style={{ width: 10, height: 10, borderRadius: 3, background: d.color }} />
              <span style={{ flex: 1, fontSize: 13, color: 'var(--ink-700)' }}>{d.label}</span>
              <span className="tnum" style={{ fontWeight: 700, fontSize: 13 }}>{d.value}%</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ── Alerts / Actions panel ────────────────────────────────
function AlertsPanel() {
  const alerts = [
    { type: 'up', title: '배추 가격 +23%', sub: '내 임계값 15% 초과 · 대체재 3개 추천', time: '방금', icon: 'zap' },
    { type: 'down', title: '오징어 −13% 할인', sub: '공급업체 마켓컬리 · 48시간 한정', time: '12분', icon: 'trending' },
    { type: 'info', title: 'OCR 영수증 2건 대기', sub: '이번 주 수기 입력 건 확인 필요', time: '1시간', icon: 'file' },
    { type: 'warn', title: '한우등심 재고 부족', sub: '예상 소진 2일 · 자동 발주 준비됨', time: '3시간', icon: 'bell' },
  ];
  const map = { up: 'chip-up', down: 'chip-down', info: 'chip-info', warn: 'chip-warn' };
  return (
    <div className="card" style={{ padding: 0 }}>
      <div style={{ padding: '20px 24px', borderBottom: '1px solid var(--ink-100)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <div>
          <div className="t-h3">내 알림</div>
          <div className="t-sm" style={{ marginTop: 2 }}>지금 확인해야 할 4건</div>
        </div>
        <button className="btn btn-ghost btn-sm">모두 보기</button>
      </div>
      <div>
        {alerts.map((a, i) => (
          <div key={i} style={{ padding: '16px 24px', display: 'flex', gap: 14, borderBottom: i < alerts.length - 1 ? '1px solid var(--ink-100)' : 'none', transition: 'background 0.15s', cursor: 'pointer' }}
            onMouseEnter={e => e.currentTarget.style.background = 'var(--ink-50)'}
            onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
            <div style={{ width: 36, height: 36, borderRadius: 10, display: 'flex', alignItems: 'center', justifyContent: 'center',
              background: a.type === 'up' ? 'var(--up-100)' : a.type === 'down' ? 'var(--down-100)' : a.type === 'warn' ? 'var(--warn-100)' : 'var(--info-100)',
              color: a.type === 'up' ? 'var(--up-500)' : a.type === 'down' ? 'var(--down-500)' : a.type === 'warn' ? 'var(--warn-500)' : 'var(--info-500)',
              flexShrink: 0 }}>
              <Icon name={a.icon} size={16} />
            </div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', gap: 8 }}>
                <div style={{ fontWeight: 600, fontSize: 14, color: 'var(--ink-900)' }}>{a.title}</div>
                <div className="t-xs">{a.time}</div>
              </div>
              <div className="t-sm" style={{ marginTop: 3 }}>{a.sub}</div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── Page ──────────────────────────────────────────────────
function Page() {
  return (
    <div style={{ display: 'flex', minHeight: '100vh' }}>
      <Sidebar active="dashboard" />
      <main style={{ flex: 1, minWidth: 0, background: 'var(--cream)' }}>
        <TopBar
          breadcrumb="대시보드"
          title="안녕하세요, 민준님 👋"
          subtitle="오늘은 2026년 4월 18일 · 날씨가 배추 가격에 영향을 주고 있어요"
          right={<>
            <div style={{ position: 'relative' }}>
              <Icon name="search" size={16} style={{ position: 'absolute', left: 12, top: 12, color: 'var(--ink-400)' }} />
              <input className="input" placeholder="식자재, 공급업체 검색..." style={{ paddingLeft: 36, width: 280, height: 40 }} />
            </div>
            <button className="btn btn-ghost btn-sm" style={{ position: 'relative', padding: 10 }}>
              <Icon name="bell" size={18} />
              <span style={{ position: 'absolute', top: 8, right: 8, width: 7, height: 7, borderRadius: 999, background: 'var(--brand-500)' }} />
            </button>
            <button className="btn btn-brand btn-sm"><Icon name="plus" size={14} /> 새로 기록</button>
          </>}
        />
        <div style={{ padding: '28px 32px', display: 'flex', flexDirection: 'column', gap: 20 }}>
          {/* Hero row */}
          <div style={{ display: 'grid', gridTemplateColumns: '1.4fr 1fr', gap: 20 }}>
            <CostThermometer />
            <SavingsOdometer />
          </div>
          {/* Stats */}
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 16 }}>
            <StatCard label="등록 식자재" value={<CountUp to={47} />} suffix="개" delta={0.043} color="var(--c1)" iconName="package" spark={[40,42,43,44,45,46,46,47]} />
            <StatCard label="활성 알림" value={<CountUp to={12} />} suffix="건" delta={0.2} color="var(--c6)" iconName="bell" spark={[8,9,9,10,10,11,12,12]} />
            <StatCard label="평균 원가율" value={<CountUp to={34} />} suffix="%" delta={-0.028} color="var(--c3)" iconName="scale" spark={[37,36.5,36,35.8,35.4,35,34.6,34]} />
            <StatCard label="레시피 수익" value={<CountUp to={48} />} suffix="%" delta={0.015} color="var(--c4)" iconName="coin" spark={[44,44.5,45,46,46.5,47,47.5,48]} />
          </div>
          {/* Chart + Donut */}
          <div style={{ display: 'grid', gridTemplateColumns: '1.6fr 1fr', gap: 20 }}>
            <MonthlyCostChart />
            <CategoryBreakdown />
          </div>
          {/* Feed + Radar */}
          <div style={{ display: 'grid', gridTemplateColumns: '1.5fr 1fr', gap: 20 }}>
            <PriceFeed />
            <PriceRadarPanel />
          </div>
          {/* Alerts */}
          <AlertsPanel />
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
</body>
</html>
